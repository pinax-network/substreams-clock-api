name: Test

on:
  push:
    branches: [ develop* ]
  pull_request:
    branches: [ develop*,main ]

jobs:
  bun-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: 'Install Dependencies'
        run: |
          bun install --frozen-lockfile

      - name: 'Run test'
        run: |
          bun pretest
          bun test
